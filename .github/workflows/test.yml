name: tests
on: [push, pull_request]
jobs:
  eunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, for the history scan below
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
      - run: sh scripts/test.sh
      # 4 Nov (second audit): the phone's rule for whether a desk video may leave the phone, on its own (the rest of the
      # phone screens' tests need LoWisa's app around them and run in its project)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test phone/__tests__/safe-video.node.test.ts
      # 4 Nov (third audit): every blob in every commit, and every picture, video and recording's metadata
      - run: python3 scripts/secret_scan.py --history
      # 4 Nov (third audit: "prove the judging path"): the recorded Exam Desk starts and answers as the README says
      - run: |
          node demo/desk-server.js --replay & sleep 2
          curl -fsS http://localhost:4747/ > /dev/null
          curl -fsS http://localhost:4747/api/witness/piles | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:4747' http://127.0.0.1:4747/)" = 403
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/check_media.py
      - run: python3 scripts/check_links.py
